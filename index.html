<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 4 - Flexbox</title>
    <style>

      h2 {
        font-family: "Arial Black", Gadget, sans-serif;
      }
      h3 {
        font-family: "Arial Black", Gadget, sans-serif;
      }

      .flip-card {
  background-color: transparent;
  width: 300px;
  height: 200px;
  border: 1px solid rgb(250, 250, 248);
  perspective: 1000px; 
}


.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}


.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}


.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden; /* Safari */
  backface-visibility: hidden;
  border: 3px solid rgb(247, 217, 47);
}


.flip-card-front {
  background-color: #bbb;
  color: black;
  border: 3px solid rgb(247, 217, 47);
}


.flip-card-back {
  background-color: rgb(235, 191, 73);
  color: white;
  transform: rotateY(180deg);
  width: 300px;
  height: 300px;
}
   .flip-card-2 {
  background-color: transparent;
  width: 300px;
  height: 200px;
  border: 1px solid rgb(250, 250, 248);
  perspective: 1000px; 
}


.flip-card-inner-2 {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}


.flip-card-2:hover .flip-card-inner-2 {
  transform: rotateY(180deg);
}


.flip-card-front-2, .flip-card-back-2 {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden; /* Safari */
  backface-visibility: hidden;
  border: 3px solid rgb(250, 126, 54);
}


.flip-card-front-2 {
  background-color: #bbb;
  color: black;
  border: 3px solid rgb(218, 107, 33);
}


.flip-card-back-2 {
  background-color: rgb(250, 107, 33);
  color: white;
  transform: rotateY(180deg);
  width: 300px;
  height: 300px;
}
    </style>
  </head>
